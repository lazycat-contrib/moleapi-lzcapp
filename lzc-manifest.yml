application:
  subdomain: moleapi
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://moleapi:8787/

services:
  moleapi:
    # upstream: ghcr.io/ca-x/moleapi:0.2.1
    image: ghcr.nju.edu.cn/ca-x/moleapi:0.2.1@sha256:98508d45887f545eb79098d1b3e8bb6d5cbfa6133e49131553ed83ab1c9dd02f
    environment:
      - TZ=Asia/Shanghai
      - MOLEAPI_BIND=0.0.0.0:8787
      # 数据在 /data（SQLite 默认）
      # 首个账号通过 setup token 注册（token 在容器日志输出）；开启注册后可自助注册
      - MOLEAPI_ALLOW_REGISTRATION={{ .U.allow_registration }}
      # 反代场景：Web 端调试内网地址需显式开启
      - MOLEAPI_ALLOW_PRIVATE_NETWORK={{ .U.allow_private_network }}
    binds:
      - /lzcapp/var/moleapi:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://127.0.0.1:8787/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
