application:
  subdomain: moleapi
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://moleapi:8787/
services:
  moleapi:
    # upstream: ghcr.io/ca-x/moleapi:0.2.2
    image: registry.lazycat.cloud/czyt/ca-x/moleapi:07a6790102b11970
    user: root
    environment:
      - TZ=Asia/Shanghai
      - MOLEAPI_BIND=0.0.0.0:8787
      # 数据在 /data（SQLite 默认）
      # 首个账号通过 setup token 注册（token 在容器日志输出）；开启注册后可自助注册
      - MOLEAPI_ALLOW_REGISTRATION={{ .U.allow_registration }}
      # 反代场景：Web 端调试内网地址需显式开启
      - MOLEAPI_ALLOW_PRIVATE_NETWORK={{ .U.allow_private_network }}
    binds:
      - /lzcapp/var/moleapi:/data
    # The runtime image is debian:bookworm-slim with only ca-certificates,
    # libstdc++6 and zlib1g installed, so neither curl nor wget exists inside
    # the container and any HTTP probe would always fail.
    healthcheck:
      disable: true
