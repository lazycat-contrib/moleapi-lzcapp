version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/moleapi.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: moleapi

build:
  run_buildscript: false

images:
  - id: moleapi
    target: service
    service: moleapi
    source: ghcr.io/ca-x/moleapi
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: MoleAPI
    summary: "自托管 API 工作台"
